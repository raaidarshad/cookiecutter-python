name: run checks
on:
  pull_request:
    branches:
      - main
    paths:
      - '**.py'

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: 'pyproject.toml'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.9"
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: run mypy
      run: uv run mypy
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: 'pyproject.toml'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.9"
    - name: Install the project
      run: uv sync --all-extras --dev

    - name: Run tests
      # For example, using `pytest`
      run: uv run pytest tests
