name: publish
on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
jobs:
  build-publish-package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: 'pyproject.toml'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.9"
    - name: Build package
      run: uv build
    - name: Publish package
      run: uv publish --token ${% raw %}{{ secrets.PYPI_TOKEN }}{% endraw %}
